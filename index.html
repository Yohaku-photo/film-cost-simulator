<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>フィルム写真 費用シミュレーター | Yohaku</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#252b2b;background:#f6f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:28px 18px 60px}header{margin-bottom:25px}.eyebrow{letter-spacing:.15em;color:#66726d;font-size:12px}h1{font-size:clamp(24px,6vw,34px);line-height:1.35;margin:10px 0}p{line-height:1.7}.note{color:#65716c;font-size:13px}.panel{background:white;border:1px solid #e2e4df;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 12px #18251a07}label{display:block;font-weight:700;margin-bottom:10px}select,input{width:100%;padding:13px;border:1px solid #cdd5d0;border-radius:10px;background:white;font-size:16px;color:#26322d}.result{background:#233b32;color:white}.result .note{color:#d3e3da}.amount{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:12px 0}.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #ffffff35}.line span:last-child{font-weight:700}footer{font-size:12px;color:#69736e;line-height:1.7;margin-top:22px}a{color:#315e4d}
</style>
</head>
<body><main>
<header><div class="eyebrow">Y O H A K U　/　2026.11 試作版</div><h1>フィルム写真<br>費用シミュレーター</h1><p>撮影から現像、デジタイズまで。自分の条件で費用を計算してみよう。</p><p class="note">現在の金額は動作確認用の仮価格です。実際の購入・依頼費用を示すものではありません。</p></header>
<section class="panel"><label for="camera">カメラ</label><select id="camera"><option value="0">所有している（追加費用なし）</option><option value="2500">中古カメラを購入（仮：2,500円）</option></select></section>
<section class="panel"><label for="film">フィルム（35mm・1本）</label><select id="film"><option value="1300">カラー（仮：1,300円）</option><option value="1050">白黒（仮：1,050円）</option></select></section>
<section class="panel"><label for="develop">現像</label><select id="develop"><option value="900">店舗へ依頼（仮：900円／本）</option><option value="home">自家現像（器具6,500円＋薬品等250円／本）</option></select></section>
<section class="panel"><label for="scan">デジタイズ</label><select id="scan"><option value="600">店舗へ依頼（仮：600円／本）</option><option value="0">手持ちのスマートフォン等を利用（追加費用なし）</option><option value="equipment">デジタイズ用機材を購入（仮：3,500円）</option></select></section>
<section class="panel"><label for="count">撮影本数</label><input id="count" type="number" min="1" max="1000" value="1" inputmode="numeric"></section>
<section class="panel result" aria-live="polite"><div>概算合計</div><div class="amount" id="total">—</div><div class="line"><span>初期費用</span><span id="initial">—</span></div><div class="line"><span>フィルム・処理費用</span><span id="running">—</span></div><div class="line"><span>1本あたり（初期費用込み）</span><span id="average">—</span></div></section>
<footer>※試作版では送料、電池、交通費、消耗品の詳細、税額差、失敗分などを含みません。自家現像とデジタイズの実施可能性は使用機材やフィルムの種類により異なります。<br>© Yohaku</footer>
</main><script>
const ids=['camera','film','develop','scan','count'];const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
function update(){const camera=Number(document.getElementById('camera').value),film=Number(document.getElementById('film').value),dev=document.getElementById('develop').value,scan=document.getElementById('scan').value,count=Math.max(1,Math.min(1000,Math.floor(Number(document.getElementById('count').value)||1)));let initial=camera+(dev==='home'?6500:0)+(scan==='equipment'?3500:0);let per=film+(dev==='home'?250:Number(dev))+(scan==='600'?600:0);document.getElementById('total').textContent=yen(initial+per*count);document.getElementById('initial').textContent=yen(initial);document.getElementById('running').textContent=yen(per*count);document.getElementById('average').textContent=yen((initial+per*count)/count)}ids.forEach(id=>document.getElementById(id).addEventListener('input',update));update();
</script></body></html>
